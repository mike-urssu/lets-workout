# Copied to the server by Jenkins. IMAGE/IMAGE_TAG come from release.env (written by Jenkins),
# database settings from .env (created once on the server from .env.example).
services:
  app:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # Public traffic comes through Traefik (HTTPS). 8080 is open on localhost only, for Jenkins' Verify stage.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.workout-api.rule: Host(`workout-api.jjoon.cloud`)
      traefik.http.routers.workout-api.entrypoints: websecure
      traefik.http.routers.workout-api.tls.certresolver: letsencrypt
      traefik.http.services.workout-api.loadbalancer.server.port: "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Object storage (SeaweedFS S3 API) already running on the server. The app must also join the network it is
      # reachable on (architecture D-TODO-ARCH-007).
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

networks:
  # Shared with the Traefik container already running on the server.
  proxy:
    external: true
